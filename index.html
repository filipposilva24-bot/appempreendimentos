<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CRM de Vendas - Imóveis</title>
    <style>
        :root {
            --primary-color: #0A66C2;
            --primary-hover: #004182;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-dark: #1F2937;
            --text-muted: #6B7280;
            --border-color: #E5E7EB;
            --alert-color: #EF4444;
            --alert-bg: #FEF2F2;
            --success-color: #10B981;
            --whatsapp-color: #25D366;
            --radius-md: 10px;
            --radius-lg: 16px;
        }

        body.dark-mode {
            --bg-color: #111827; --card-bg: #1F2937; --text-dark: #F9FAFB;
            --text-muted: #9CA3AF; --border-color: #374151; --alert-bg: #7F1D1D;
        }

        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: var(--bg-color); margin: 0; padding: 12px 10px; color: var(--text-dark); transition: background-color 0.3s, color 0.3s; }
        .container { max-width: 480px; background: var(--card-bg); padding: 22px 18px; border-radius: var(--radius-lg); box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin: auto; transition: background-color 0.3s; }
        #telaApp.container { max-width: 600px; }

        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        h2 { font-size: 20px; font-weight: 700; margin: 0; text-align: center; }
        .btn-tema { background: transparent; border: 1px solid var(--border-color); color: var(--text-dark); padding: 6px 10px; border-radius: 20px; font-size: 13px; cursor: pointer; }

        .dashboard { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 20px; }
        .dash-card { background: rgba(10, 102, 194, 0.05); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 10px 6px; text-align: center; }
        body.dark-mode .dash-card { background: rgba(255, 255, 255, 0.03); }
        .dash-card span { display: block; font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; margin-bottom: 4px; }
        .dash-card strong { font-size: 14px; color: var(--primary-color); }

        h3 { font-size: 15px; color: var(--text-dark); margin: 20px 0 10px 0; border-bottom: 2px solid var(--border-color); padding-bottom: 4px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 11px; font-weight: 700; color: var(--text-muted); margin-bottom: 4px; text-transform: uppercase; }
        input, select, textarea { width: 100% !important; padding: 11px 14px !important; border: 1.5px solid var(--border-color) !important; border-radius: var(--radius-md) !important; box-sizing: border-box !important; font-size: 15px !important; background-color: var(--bg-color) !important; color: var(--text-dark) !important; display: block; appearance: none; }
        input:focus, select:focus, textarea:focus { outline: none !important; border-color: var(--primary-color) !important; }
        
        button { width: 100%; padding: 14px; background-color: var(--primary-color); color: white; border: none; border-radius: var(--radius-md); cursor: pointer; font-size: 15px; font-weight: 600; margin-top: 8px; }
        .btn-secundario { background-color: #4B5563; }
        .btn-sair { background-color: transparent; color: var(--alert-color); border: 1.5px solid var(--alert-color); margin-top: 25px; }

        .auth-toggle { text-align: center; margin-top: 15px; font-size: 13px; color: var(--text-muted); }
        .auth-toggle span { color: var(--primary-color); font-weight: 600; cursor: pointer; }
        
        .ficha-tecnica-box { background: rgba(10, 102, 194, 0.04); border: 1.5px dashed var(--primary-color); border-radius: var(--radius-md); padding: 12px; margin-top: 8px; font-size: 12px; line-height: 1.4; display: none; }
        body.dark-mode .ficha-tecnica-box { background: rgba(10, 102, 194, 0.1); }

        .filtros-rapidos { display: flex; gap: 6px; margin: 15px 0 10px 0; overflow-x: auto; padding-bottom: 4px; }
        .filtro-btn { background: var(--border-color); color: var(--text-dark); border: none; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; width: auto !important; margin: 0; }
        .filtro-btn.ativo { background: var(--primary-color); color: white; }

        .tag-empreendimento-container { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
        .tag-empreendimento { background: rgba(3, 105, 161, 0.1); color: var(--primary-color); padding: 5px 8px; border-radius: 6px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 4px; border: 1px solid var(--border-color); }
        .tag-empreendimento span { cursor: pointer; color: var(--alert-color); font-weight: bold; font-size: 14px; }

        .busca-container { margin: 15px 0 10px 0; position: relative; }
        .busca-container input { padding-left: 36px !important; border-radius: 30px !important; }
        .busca-icon { position: absolute; left: 12px; top: 13px; font-size: 16px; color: var(--text-muted); z-index: 10; }

        .kanban-board { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 10px; margin-top: 10px; scroll-snap-type: x mandatory; }
        .kanban-coluna { min-width: 260px; max-width: 260px; background: rgba(0,0,0,0.02); border: 1px solid var(--border-color); border-radius: var(--radius-md); padding: 10px; display: flex; flex-direction: column; scroll-snap-align: start; }
        body.dark-mode .kanban-coluna { background: rgba(255,255,255,0.01); }
        .kanban-coluna h4 { font-size: 13px; text-transform: uppercase; margin: 0 0 10px 0; padding-bottom: 6px; border-bottom: 2px solid var(--border-color); display: flex; justify-content: space-between; position: sticky; top: 0; background: var(--card-bg); z-index: 5; }
        .kanban-cards-container { max-height: 420px; overflow-y: auto; padding-right: 4px; }
        
        .card { background: var(--card-bg); padding: 12px; border: 1px solid var(--border-color); border-radius: var(--radius-md); margin-bottom: 10px; }
        .card.alerta { border-left: 4px solid var(--alert-color); }
        .card h3 { margin: 0 0 6px 0; font-size: 14px; color: var(--text-dark); }
        .card p { margin: 3px 0; font-size: 12px; color: var(--text-muted); }

        .badge-temp { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 6px; border-radius: 4px; margin-bottom: 6px; }
        .temp-quente { background: #FEE2E2; color: #DC2626; }
        .temp-morno { background: #FEF3C7; color: #D97706; }
        .temp-frio { background: #E0E7FF; color: #4338CA; }

        .tag-alerta { display: block; background-color: var(--alert-bg); color: var(--alert-color); padding: 4px 6px; border-radius: 4px; font-size: 10px; font-weight: 700; margin-top: 6px; text-align: center; }
        .historico-box { background: rgba(0,0,0,0.02); border: 1px solid var(--border-color); border-radius: 4px; padding: 6px; margin-top: 6px; font-size: 11px; }
        .historico-item { margin-bottom: 3px; border-bottom: 1px dashed var(--border-color); padding-bottom: 2px; }

        .card-acoes { display: flex; gap: 4px; margin-top: 8px; }
        .btn-whats { background-color: var(--whatsapp-color); color: white; padding: 6px 8px; font-size: 11px; font-weight: 600; border-radius: 4px; flex: 1; text-align: center; text-decoration: none; }
        .btn-add-obs, .btn-mover, .btn-excluir { border-radius: 4px; font-size: 11px; font-weight: 600; padding: 5px 8px; cursor: pointer; }
        .btn-add-obs { background-color: #4B5563; color: white; width: 100%; border: none; margin-top: 5px; }
        .btn-mover { background-color: var(--primary-color); color: white; width: 100%; border: none; margin-top: 6px; }
        .btn-excluir { background-color: transparent; color: var(--alert-color); border: 1px solid var(--alert-color); width: auto; margin-top: 0;}
        
        #telaApp { display: none; }
        #msgErro { color: var(--alert-color); text-align: center; margin-top: 10px; font-weight: 600; display: none; font-size: 13px; }
    </style>
</head>
<body>

<!-- TELA DE LOGIN / CADASTRO -->
<div class="container" id="telaLogin">
    <h2 id="tituloAuth">Acesso ao Sistema</h2>
    <form id="formAuth" style="margin-top: 15px;">
        <div class="form-group"><label>E-mail</label><input type="email" id="emailLogin" required></div>
        <div class="form-group"><label>Senha</label><input type="password" id="senhaLogin" required></div>
        <button type="submit" id="btnAuthSubmit">Entrar no Sistema</button>
        <p id="msgErro"></p>
    </form>
    <div class="auth-toggle"><span id="textoToggle" onclick="alternarModoAuth()">Não tem uma conta? Cadastre-se grátis</span></div>
</div>

<!-- TELA PRINCIPAL DO APP -->
<div class="container" id="telaApp">
    <div class="header-top">
        <h2>CRM de Vendas</h2>
        <button class="btn-tema" id="btnAlternarTema" onclick="alternarTema()">🌙 Tema</button>
    </div>

    <!-- DASHBOARD -->
    <div class="dashboard">
        <div class="dash-card"><span>Ativos</span><strong id="dashTotal">0</strong></div>
        <div class="dash-card"><span>🚨 Ligar Hoje</span><strong id="dashHoje" style="color: var(--alert-color);">0</strong></div>
        <div class="dash-card"><span>⭐ VGV Fechado</span><strong id="dashVGV" style="font-size: 11px;">R$ 0</strong></div>
    </div>
    
    <!-- FORMULÁRIO DO CLIENTE -->
    <form id="formContato">
        <div style="display: flex; gap: 8px;">
            <div class="form-group" style="flex: 2;"><label>Data</label><input type="date" id="data" required></div>
            <div class="form-group" style="flex: 1;"><label>Horário</label><input type="time" id="horario"></div>
        </div>
        <div class="form-group"><label>Nome do Cliente</label><input type="text" id="nome" required autocomplete="off"></div>
        <div class="form-group"><label>WhatsApp / Telefone</label><input type="tel" id="contato" maxlength="15" required autocomplete="off"></div>

        <div class="form-group">
            <label>Empreendimento de Interesse</label>
            <select id="empreendimento" required onchange="mostrarFichaTecnicaCliente(this.value)">
                <option value="" disabled selected>Carregando seus empreendimentos...</option>
            </select>
            <div class="ficha-tecnica-box" id="fichaTecnicaBox"></div>
        </div>

        <div style="display: flex; gap: 8px;">
            <div class="form-group" style="flex: 1;"><label>Valor Acordado</label><input type="text" id="valor" required></div>
            <div class="form-group" style="flex: 1;"><label>Temperatura 🔥</label><select id="temperatura"><option>🔥 Quente</option><option selected>🟡 Morno</option><option>❄️ Frio</option></select></div>
        </div>

        <div style="display: flex; gap: 8px;">
            <div class="form-group" style="flex: 1;"><label>Status</label><select id="status"><option>🟡 Em Contato</option><option>🔵 Aguardando Doc</option><option>🟢 Crédito Aprovado</option><option>⭐ Vendido</option><option>🔴 Perdido</option></select></div>
            <div class="form-group" style="flex: 1;"><label>Origem</label><select id="origem"><option>📱 Instagram</option><option>🤝 Indicação</option><option>🏢 Plantão</option><option>📌 Outros</option></select></div>
        </div>

        <div class="form-group">
            <label>Obstáculo Identificado</label>
            <select id="obstaculo"><option value="Nenhum">✅ Nenhum obstáculo</option><option value="Nome Sujo">⚠️ Nome Sujo (Retorno 30 dias)</option><option value="Outros">⚠️ Outros - Renda/Doc (Retorno 15 dias)</option></select>
        </div>
        <div class="form-group"><label>Observação / Detalhe</label><textarea id="obs" rows="2"></textarea></div>

        <button type="submit">Salvar Cliente no CRM</button>
    </form>

    <!-- GERENCIAR EMPREENDIMENTOS -->
    <h3 style="margin-top: 30px;">Gerenciar Meus Empreendimentos</h3>
    <p style="font-size: 11px; color: var(--text-muted); margin-top:-5px;">Comece a digitar abaixo para o app buscar no Super Banco.</p>
    
    <div class="tag-empreendimento-container" id="listaEmpreendimentosChips"></div>
    <datalist id="bancoMestre"></datalist>

    <form id="formNovoEmpreendimento" style="margin-top: 12px;">
        <div class="form-group" style="margin-bottom: 8px;">
            <label>Buscar ou Digitar Novo</label>
            <input type="text" id="novoEmpreendimentoNome" list="bancoMestre" placeholder="Ex: Dez Guarulhos..." required autocomplete="off">
        </div>
        <div class="form-group" style="margin-bottom: 8px;">
            <label>Ficha Técnica / Descrição</label>
            <textarea id="novoEmpreendimentoDesc" rows="3" placeholder="A ficha técnica aparecerá aqui automaticamente..."></textarea>
        </div>
        <button type="submit" class="btn-secundario">Adicionar à Minha Lista</button>
    </form>

    <!-- KANBAN E BUSCA -->
    <h3 style="margin-top: 30px;">Funil de Vendas</h3>
    <div class="filtros-rapidos">
        <button class="filtro-btn ativo" onclick="filtrarStatus('TODOS', this)">Todos</button>
        <button class="filtro-btn" onclick="filtrarStatus('HOJE', this)">🚨 Ligar Hoje</button>
        <button class="filtro-btn" onclick="filtrarStatus('OBSTACULO', this)">⚠️ Com Obstáculos</button>
    </div>
    <div class="busca-container">
        <span class="busca-icon">🔍</span>
        <input type="text" id="busca" placeholder="Buscar cliente, tel ou empreendimento...">
    </div>
    <div class="kanban-board" id="kanbanBoard"></div>

    <button id="btnSair" class="btn-sair">Sair da Conta</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, deleteDoc, doc, onSnapshot, query, orderBy, serverTimestamp, arrayUnion } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyDLkz8nVg_NPNNZvg4VQNEZyF0Ju-GjyO4", authDomain: "appbatalha-910d2.firebaseapp.com",
        projectId: "appbatalha-910d2", storageBucket: "appbatalha-910d2.firebasestorage.app",
        messagingSenderId: "580640530854", appId: "1:580640530854:web:adcf9e15e8e79c680def67"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app); const auth = getAuth(app);
    const contatosRef = collection(db, "clientes"); const empreendimentosRef = collection(db, "empreendimentos");

    // --- SUPER BANCO DE DADOS (EXPANDIDO) ---
    // Adicionei vários empreendimentos de SP, Guarulhos e região de diversas construtoras
    const masterDB = [
        // CURY
        { nome: "Alto São Domingos (Cury)", desc: "🏢 Alto São Domingos (Cury)\n📍 Pirituba / São Domingos\n📐 2 dorms com varanda.\n🏊‍♂️ Lazer: Piscina, churrasqueira, academia, coworking." },
        { nome: "Mais Butantã (Cury)", desc: "🏢 Cury Máximo Butantã\n📍 Butantã (Zona Oeste)\n📐 2 dorms c/ suíte e terraço.\n🏊‍♂️ Lazer completo." },
        { nome: "Plano Leopoldina (Cury)", desc: "🏢 Nova Leopoldina Art\n📍 Vila Leopoldina\n📐 1 e 2 dorms c/ terraço." },
        { nome: "Praça Pirituba (Cury)", desc: "🏢 Lyne Pirituba (Cury)\n📍 Frente Estação Pirituba\n📐 2 dorms c/ terraço." },
        { nome: "Dez Guarulhos (Cury)", desc: "🏢 Dez Guarulhos (Cury)\n📍 Vila Augusta, Guarulhos\n📐 2 dormitórios com vaga." },
        { nome: "Único Guarulhos (Cury)", desc: "🏢 Único Guarulhos\n📍 Guarulhos (Centro)\n📐 2 dorms, lazer completo." },
        
        // PLANO & PLANO
        { nome: "Duetto São Domingos (Plano&Plano)", desc: "🏢 Duetto São Domingos\n📍 Parque São Domingos\n📐 1 e 2 dorms com varanda." },
        { nome: "Plano Jaçanã (Plano&Plano)", desc: "🏢 Plano&Jaçanã\n📍 Av. Luís Stamatis, ZN\n📐 2 dorms com terraço." },
        { nome: "Plano&Estação Pirituba", desc: "🏢 Plano&Estação Pirituba\n📍 Pirituba\n📐 2 dormitórios (MCMV)." },
        { nome: "Plano&Guarulhos", desc: "🏢 Plano&Guarulhos\n📍 Centro de Guarulhos\n📐 1 e 2 dorms, lazer de clube." },
        
        // DIRECIONAL
        { nome: "Riserva Metrópole (Direcional)", desc: "🏢 Riserva Metrópole\n📍 São Paulo\n📐 1 e 2 dorms, alto padrão de acabamento." },
        { nome: "Conquista Guarulhos (Direcional)", desc: "🏢 Conquista Guarulhos\n📍 Guarulhos\n📐 2 dorms (Pronto/Em Obras)." },
        
        // TENDA
        { nome: "Tenda Vila Maria", desc: "🏢 Residencial Tenda Vila Maria\n📍 Zona Norte, SP\n📐 2 dormitórios (Programa Casa Verde e Amarela)." },
        { nome: "Tenda Bonsucesso Guarulhos", desc: "🏢 Tenda Bonsucesso\n📍 Guarulhos\n📐 1 e 2 dorms, ideal para primeiro imóvel." },
        
        // MRV
        { nome: "Grand Reserva Paulista (MRV)", desc: "🏢 Grand Reserva Paulista\n📍 Pirituba, SP\n📐 2 dorms, condomínio fechado com vaga." },
        { nome: "Parque Sintra (MRV)", desc: "🏢 Parque Sintra (MRV)\n📍 Guarulhos\n📐 2 dorms com lazer completo e segurança 24h." },

        // VIVAZ
        { nome: "Vivaz Guarulhos", desc: "🏢 Vivaz Guarulhos\n📍 Av. Guarulhos\n📐 2 dorms c/ sacada e vaga." },
        { nome: "Vivaz Pirituba", desc: "🏢 Vivaz Pirituba\n📍 Pirituba\n📐 2 dormitórios." }
    ];

    const datalist = document.getElementById('bancoMestre');
    masterDB.forEach(emp => { let option = document.createElement('option'); option.value = emp.nome; datalist.appendChild(option); });

    document.getElementById('novoEmpreendimentoNome').addEventListener('input', function(e) {
        const val = e.target.value;
        const achado = masterDB.find(emp => emp.nome.toLowerCase() === val.toLowerCase());
        if (achado) document.getElementById('novoEmpreendimentoDesc').value = achado.desc;
    });

    let contatosBaixados = []; let mapaEmpreendimentos = {}; let filtroAtual = 'TODOS';
    let unsubContatos = null; let unsubEmpreendimentos = null; let modoCadastro = false;

    window.alternarModoAuth = function() {
        modoCadastro = !modoCadastro;
        const titulo = document.getElementById('tituloAuth'); const btn = document.getElementById('btnAuthSubmit'); const toggle = document.getElementById('textoToggle');
        document.getElementById('msgErro').style.display = 'none';
        titulo.innerText = modoCadastro ? "Criar Nova Conta" : "Acesso ao Sistema";
        btn.innerText = modoCadastro ? "Cadastrar no Sistema" : "Entrar no Sistema";
        toggle.innerText = modoCadastro ? "Já tem uma conta? Faça login" : "Não tem uma conta? Cadastre-se grátis";
    }

    window.mostrarFichaTecnicaCliente = function(nome) {
        const box = document.getElementById('fichaTecnicaBox');
        if(mapaEmpreendimentos[nome] && mapaEmpreendimentos[nome].trim() !== '') {
            box.innerHTML = mapaEmpreendimentos[nome].replace(/\n/g, '<br>'); box.style.display = 'block';
        } else { box.style.display = 'none'; }
    }

    function carregarEmpreendimentos() {
        const q = query(empreendimentosRef, orderBy("nome", "asc"));
        unsubEmpreendimentos = onSnapshot(q, (snapshot) => {
            const select = document.getElementById('empreendimento'); const chips = document.getElementById('listaEmpreendimentosChips');
            const valorAtual = select.value;
            select.innerHTML = '<option value="" disabled selected>Selecione o empreendimento...</option>';
            chips.innerHTML = ''; mapaEmpreendimentos = {};

            snapshot.forEach((docSnap) => {
                const emp = docSnap.data(); const id = docSnap.id;
                mapaEmpreendimentos[emp.nome] = emp.desc || '';
                const opt = document.createElement('option'); opt.value = emp.nome; opt.textContent = emp.nome; select.appendChild(opt);
                const chip = document.createElement('div'); chip.className = 'tag-empreendimento';
                chip.innerHTML = `${emp.nome} <span onclick="excluirEmpreendimento('${id}', '${emp.nome}')">&times;</span>`; chips.appendChild(chip);
            });
            if(valorAtual && mapaEmpreendimentos[valorAtual] !== undefined) { select.value = valorAtual; mostrarFichaTecnicaCliente(valorAtual); }
        });
    }

    document.getElementById('formNovoEmpreendimento').addEventListener('submit', async function(e) {
        e.preventDefault();
        const nomeInput = document.getElementById('novoEmpreendimentoNome'); const descInput = document.getElementById('novoEmpreendimentoDesc');
        if(nomeInput.value.trim()) {
            const btn = this.querySelector('button'); btn.innerText = 'Salvando...';
            try { await addDoc(empreendimentosRef, { nome: nomeInput.value.trim(), desc: descInput.value.trim() }); nomeInput.value = ''; descInput.value = ''; } 
            catch(err) { alert("Erro: " + err.message); } finally { btn.innerText = 'Adicionar à Minha Lista'; }
        }
    });

    window.excluirEmpreendimento = async function(id, nome) {
        if(confirm(`Remover "${nome}" da sua lista ativa?`)) await deleteDoc(doc(db, "empreendimentos", id));
    };

    window.alternarTema = function() {
        document.body.classList.toggle('dark-mode'); localStorage.setItem('crm_tema', document.body.classList.contains('dark-mode') ? 'dark' : 'light');
        document.getElementById('btnAlternarTema').innerText = document.body.classList.contains('dark-mode') ? '☀️ Tema' : '🌙 Tema';
    }
    if(localStorage.getItem('crm_tema') === 'dark') { document.body.classList.add('dark-mode'); setTimeout(() => { document.getElementById('btnAlternarTema').innerText = '☀️ Tema'; }, 100); }

    document.getElementById('contato').addEventListener('input', e => { let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,5})(\d{0,4})/); e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : ''); });
    document.getElementById('valor').addEventListener('input', e => { let v = e.target.value.replace(/\D/g, ''); v = (v / 100).toFixed(2).replace(".", ",").replace(/(\d)(?=(\d{3})+(?!\d))/g, '$1.'); e.target.value = v ? 'R$ ' + v : ''; });

    onAuthStateChanged(auth, async (user) => {
        if (user) { document.getElementById('telaLogin').style.display = 'none'; document.getElementById('telaApp').style.display = 'block'; carregarEmpreendimentos(); carregarDadosDoBanco(); document.getElementById('data').valueAsDate = new Date(); const agora = new Date(); document.getElementById('horario').value = String(agora.getHours()).padStart(2, '0') + ':' + String(agora.getMinutes()).padStart(2, '0'); } 
        else { document.getElementById('telaLogin').style.display = 'block'; document.getElementById('telaApp').style.display = 'none'; if(unsubContatos) unsubContatos(); if(unsubEmpreendimentos) unsubEmpreendimentos(); }
    });

    document.getElementById('formAuth').addEventListener('submit', async (e) => {
        e.preventDefault(); const email = document.getElementById('emailLogin').value; const senha = document.getElementById('senhaLogin').value; const btn = document.getElementById('btnAuthSubmit'); const msgErro = document.getElementById('msgErro');
        btn.innerText = "Carregando..."; btn.disabled = true; msgErro.style.display = 'none';
        try { if(modoCadastro) await createUserWithEmailAndPassword(auth, email, senha); else await signInWithEmailAndPassword(auth, email, senha); document.getElementById('formAuth').reset(); } 
        catch (error) { msgErro.style.display = 'block'; msgErro.innerText = "Falha na autenticação."; } 
        finally { btn.innerText = modoCadastro ? "Cadastrar no Sistema" : "Entrar no Sistema"; btn.disabled = false; }
    });

    document.getElementById('btnSair').addEventListener('click', () => signOut(auth));

    function atualizarDashboard(listaCompleta) {
        const hoje = new Date(); hoje.setHours(0,0,0,0);
        let [totalAtivos, ligarHojeCount, vgvTotal] = [listaCompleta.length, 0, 0];
        listaCompleta.forEach(c => {
            if (c.diasRetorno && c.dataStr) { const dataBase = new Date(c.dataStr + 'T00:00:00'); dataBase.setDate(dataBase.getDate() + c.diasRetorno); if (dataBase <= hoje) ligarHojeCount++; }
            if (['Vendido', 'Crédito Aprovado'].includes(c.status) && c.valor) { let valNum = parseFloat(c.valor.replace('R$', '').replaceAll('.', '').replace(',', '.').trim()); if (!isNaN(valNum)) vgvTotal += valNum; }
        });
        document.getElementById('dashTotal').innerText = totalAtivos; document.getElementById('dashHoje').innerText = ligarHojeCount; document.getElementById('dashVGV').innerText = vgvTotal.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL', maximumFractionDigits: 0 });
    }

    function renderizarKanban(lista) {
        const board = document.getElementById('kanbanBoard'); board.innerHTML = '';
        const cols = [{ id: 'Em Contato', t: '🟡 Em Contato', p: 'Aguardando Documento' }, { id: 'Aguardando Documento', t: '🔵 Aguardando Doc', p: 'Crédito Aprovado', a: 'Em Contato' }, { id: 'Crédito Aprovado', t: '🟢 Crédito Aprovado', p: 'Vendido', a: 'Aguardando Documento' }, { id: 'Vendido', t: '⭐ Vendido', a: 'Crédito Aprovado' }, { id: 'Perdido', t: '🔴 Perdido' }];
        const hoje = new Date(); hoje.setHours(0,0,0,0);
        cols.forEach(col => {
            const clientes = lista.filter(c => (c.status || 'Em Contato') === col.id);
            const dCol = document.createElement('div'); dCol.className = 'kanban-coluna'; dCol.innerHTML = `<h4>${col.t} <span>(${clientes.length})</span></h4>`;
            const cCont = document.createElement('div'); cCont.className = 'kanban-cards-container';
            if (clientes.length === 0) cCont.innerHTML = '<p style="text-align:center; color:var(--text-muted); font-size:11px; margin:15px 0;">Nenhum lead</p>';
            else clientes.forEach(c => {
                let deveLigar = false; if (c.diasRetorno && c.dataStr) { const db = new Date(c.dataStr + 'T00:00:00'); db.setDate(db.getDate() + c.diasRetorno); if (db <= hoje) deveLigar = true; }
                const card = document.createElement('div'); card.className = deveLigar ? 'card alerta' : 'card';
                let tClass = c.temperatura === '🔥 Quente' ? 'temp-quente' : (c.temperatura === '❄️ Frio' ? 'temp-frio' : 'temp-morno');
                let hHtml = ''; if (c.historico && c.historico.length > 0) { hHtml = '<div class="historico-box">'; c.historico.forEach(h => { hHtml += `<div class="historico-item"><small style="opacity:0.7">${h.data}:</small> ${h.texto}</div>`; }); hHtml += '</div>'; }
                let hCard = `<span class="badge-temp ${tClass}">${c.temperatura || '🟡 Morno'}</span><h3>👤 ${c.nome}</h3><p><strong>📞</strong> ${c.contato}</p><p><strong>🏢</strong> ${c.empreendimento}</p><p><strong>💰</strong> ${c.valor}</p>${hHtml}`;
                if (c.dataRetornoFormatada) hCard += `<div class="tag-alerta">⏰ Retorno: ${c.dataRetornoFormatada}</div>`;
                hCard += `${col.a ? `<button class="btn-mover" onclick="mudarStatus('${c.id}', '${col.a}')">⬅️ Voltar</button>` : ''}${col.p ? `<button class="btn-mover" onclick="mudarStatus('${c.id}', '${col.p}')">Avançar ➡️</button>` : ''}<button class="btn-add-obs" onclick="adicionarInteracao('${c.id}')">➕ Nota</button><div class="card-acoes"><a href="https://wa.me/55${c.contato.replace(/\D/g, '')}" target="_blank" class="btn-whats">💬 Whats</a><button class="btn-excluir" onclick="excluirCliente('${c.id}')">Excluir</button></div>`;
                card.innerHTML = hCard; cCont.appendChild(card);
            });
            dCol.appendChild(cCont); board.appendChild(dCol);
        });
    }

    function carregarDadosDoBanco() {
        onSnapshot(query(contatosRef, orderBy("timestamp", "desc")), (snapshot) => {
            contatosBaixados = []; snapshot.forEach((doc) => { contatosBaixados.push({ id: doc.id, ...doc.data() }); });
            atualizarDashboard(contatosBaixados); aplicarFiltrosEBusca();
        });
    }

    window.mudarStatus = async (id, s) => { try { await updateDoc(doc(db, "clientes", id), { status: s }); } catch (e) { alert("Erro: " + e.message); } };
    window.filtrarStatus = (tipo, btn) => { document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('ativo')); btn.classList.add('ativo'); filtroAtual = tipo; aplicarFiltrosEBusca(); }
    document.getElementById('busca').addEventListener('input', aplicarFiltrosEBusca);

    function aplicarFiltrosEBusca() {
        const termo = document.getElementById('busca').value.toLowerCase(); const hoje = new Date(); hoje.setHours(0,0,0,0);
        let filtrados = contatosBaixados.filter(c => c.nome.toLowerCase().includes(termo) || c.contato.includes(termo) || c.empreendimento.toLowerCase().includes(termo));
        if (filtroAtual === 'HOJE') filtrados = filtrados.filter(c => { if (!c.diasRetorno || !c.dataStr) return false; const d = new Date(c.dataStr + 'T00:00:00'); d.setDate(d.getDate() + c.diasRetorno); return d <= hoje; });
        else if (filtroAtual === 'OBSTACULO') filtrados = filtrados.filter(c => c.obstaculo && c.obstaculo !== 'Nenhum');
        renderizarKanban(filtrados);
    }

    window.adicionarInteracao = async (id) => { const n = prompt("Digite a nota:"); if (n && n.trim() !== "") await updateDoc(doc(db, "clientes", id), { historico: arrayUnion({ data: new Date().toLocaleDateString('pt-BR'), texto: n.trim() }) }); };
    window.excluirCliente = async (id) => { if (confirm("Deseja excluir este cliente?")) await deleteDoc(doc(db, "clientes", id)); }

    document.getElementById('formContato').addEventListener('submit', async function(e) {
        e.preventDefault(); const btn = this.querySelector('button'); btn.innerText = "Salvando..."; btn.disabled = true;
        const dStr = document.getElementById('data').value; const obs = document.getElementById('obstaculo').value; const nI = document.getElementById('obs').value.trim();
        let dRet = (obs === 'Nome Sujo') ? 30 : ((obs === 'Outros') ? 15 : 0); let dRetF = null;
        if (dRet > 0) { let d = new Date(dStr + 'T00:00:00'); d.setDate(d.getDate() + dRet); dRetF = d.toLocaleDateString('pt-BR'); }
        try {
            await addDoc(contatosRef, {
                dataStr: dStr, horario: document.getElementById('horario').value || '', dataFormatada: dStr.split('-').reverse().join('/'),
                nome: document.getElementById('nome').value, contato: document.getElementById('contato').value,
                empreendimento: document.getElementById('empreendimento').value, valor: document.getElementById('valor').value,
                temperatura: document.getElementById('temperatura').value, origem: document.getElementById('origem').value,
                status: document.getElementById('status').value, obstaculo: obs, diasRetorno: dRet, dataRetornoFormatada: dRetF,
                historico: nI ? [{ data: new Date(dStr + 'T00:00:00').toLocaleDateString('pt-BR'), texto: nI }] : [], timestamp: serverTimestamp()
            });
            this.reset(); document.getElementById('data').valueAsDate = new Date(); document.getElementById('fichaTecnicaBox').style.display = 'none';
        } catch (e) { alert("Erro ao salvar: " + e.message); } finally { btn.innerText = "Salvar Cliente no CRM"; btn.disabled = false; }
    });
</script>
</body>
</html>
